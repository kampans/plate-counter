<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Plate counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span></span><h1>Plate counter</h1></div>

    </header>
    <div class="app-layout">
    <div class="workspace">
      <section class="visual" aria-label="Barbell viewed from one side">
        <div class="barbell-view">
          <div class="barbell" aria-hidden="true">
            <div class="barbell-shaft"></div>
            <div class="barbell-shoulder"></div>
            <div class="barbell-sleeve"><div id="plate-stack"></div></div>
          </div>
        </div>
      </section>
      <section class="counter" aria-label="Barbell weight">
        <div class="counter-heading"><p>Total weight</p><span>KG</span></div>
        <div class="total"><span id="total" aria-live="off">20</span> <span>kg</span></div>
        <p id="total-announcement" class="sr-only" aria-live="polite"></p>
        <div class="counter-details"><p><span>BAR</span><strong id="bar-weight">20 kg</strong></p><p><span>PLATES / SIDE</span><strong id="per-side">0 kg</strong></p></div>
      </section>
      <section class="controls" aria-labelledby="plates-title">
        <div class="controls-heading"><div><h2 id="plates-title">Add plates</h2></div><p>One tap adds a pair</p></div>
        <div id="plate-buttons" class="plate-buttons"></div>
        <div class="actions"><button id="undo" type="button" disabled>Undo</button><button id="clear" type="button" disabled>Clear all</button></div>
      </section>
    </div>
    <aside class="calculators" aria-label="Lifting calculators">
      <section class="calculator" aria-labelledby="one-rm-title">
        <h2 id="one-rm-title">1RM calculator</h2>
        <form id="one-rm-form" class="calculator-inputs">
          <label>Weight (kg)<input name="weight" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label>Reps<input name="reps" type="number" min="1" max="10" step="1" inputmode="numeric" required></label>
          <label class="calculator-wide">Formula
            <select name="formula">
              <option value="epley">Epley</option>
              <option value="brzycki">Brzycki</option>
            </select>
          </label>
        </form>
        <p class="calculator-note">Enter the weight and reps from a hard set of 1?10 reps.</p>
        <output id="one-rm-result" class="calculator-result" aria-live="polite"></output>
      </section>
    </aside>
    </div>
    <footer><span>PLATE COUNTER</span><span>LOADED ON BOTH SIDES</span></footer>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="one-rm.js"></script>
</body>
</html>
