<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plate counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><h1>Plate counter</h1><p>Add a plate to each side of the bar.</p></header>
    <section class="scene-wrap" aria-label="Barbell visualization">
      <div id="barbell-scene"></div>
      <p id="scene-error" hidden>3D visualization could not be loaded. The counter still works.</p>
    </section>
    <section class="counter" aria-label="Barbell weight">
      <p>Total weight</p>
      <div class="total"><span id="total" aria-live="off">20</span> <span>kg</span></div>
      <p id="total-announcement" class="sr-only" aria-live="polite"></p>
      <p><span id="bar-weight">20 kg</span> bar · <span id="per-side">0 kg</span> of plates per side</p>
    </section>
    <section class="controls" aria-labelledby="plates-title">
      <h2 id="plates-title">Add plates</h2>
      <div id="plate-buttons" class="plate-buttons"></div>
      <div class="actions"><button id="undo" type="button" disabled>Undo</button><button id="clear" type="button" disabled>Clear</button></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="scene.js"></script>
  <script src="script.js"></script>
</body>
</html>
