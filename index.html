<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Plate Counter</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="container">
		<div class="card">
			<div class="section-title">target weight</div>

			<div class="input-group">
				<div>
					<label for="target">weight</label>
					<input type="number" id="target" placeholder="e.g. 100" step="0.25" min="0" />
				</div>
				<div>
					<label for="unit">units</label>
					<select id="unit">
						<option value="kg">kg</option>
						<option value="lbs">lbs</option>
					</select>
				</div>
			</div>

			<div class="section-title">barbell weight</div>
			<div class="bar-select">
				<button type="button" class="bar-btn active" data-bar="20">20 kg</button>
				<button type="button" class="bar-btn" data-bar="15">15 kg</button>
				<button type="button" class="bar-btn" data-bar="custom">custom</button>
			</div>
			<div class="custom-bar-wrap" style="display: none;">
				<label for="customBar">custom bar (kg)</label>
				<input type="number" id="customBar" placeholder="20" step="0.25" min="0" />
			</div>

			<button type="button" class="calc-btn" id="calc">calculate</button>
		</div>

		<div class="card results" id="results" style="display: none;">
			<div class="total-weight">
				<div class="label">total bar weight</div>
				<div class="value" id="totalDisplay">0 kg</div>
			</div>
			<div class="per-side" id="perSide">per side</div>

			<div id="plateList"></div>

			<div class="barbell-visual">
				<div class="side-label left">per side</div>
				<div class="bar" id="barVisual">
					<div class="bar-fill"></div>
					<div class="plates-on-bar" id="platesVisual"></div>
				</div>
				<div class="side-label right">per side</div>
			</div>
		</div>

		<div class="empty-state" id="emptyState">
			<p>enter a target weight</p>
			<p style="font-size: 0.85rem;">and hit calculate</p>
		</div>

		<div class="footer">
			plate counter &bull; built for powerlifters
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script src="script.js"></script>
</body>
</html>
