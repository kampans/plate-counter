<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Plate counter</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main>
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span></span><h1>Plate counter</h1></div>
      <nav class="site-tabs" aria-label="Pages"><a href="index.html" aria-current="page">Counter</a><a href="rank.html">Rank</a></nav>
    </header>
    <div class="app-layout">
    <div class="workspace">
      <section class="visual" aria-label="Barbell viewed from one side">
        <div class="barbell-view">
          <div class="barbell" aria-hidden="true">
            <div class="barbell-shaft"></div>
            <div class="barbell-shoulder"></div>
            <div class="barbell-sleeve"><div id="plate-stack"></div></div>
          </div>
        </div>
      </section>
      <section class="counter" aria-label="Barbell weight">
        <div class="counter-heading"><p>Total weight</p><span>KG</span></div>
        <div class="total"><span id="total" aria-live="off">20</span> <span>kg</span></div>
        <p id="total-announcement" class="sr-only" aria-live="polite"></p>
        <div class="counter-details"><p><span>BAR</span><strong id="bar-weight">20 kg</strong></p><p><span>PLATES / SIDE</span><strong id="per-side">0 kg</strong></p></div>
      </section>
      <section class="controls" aria-labelledby="plates-title">
        <div class="target-load">
          <div class="target-fields">
            <label for="target-weight">Target weight (kg)<input id="target-weight" type="number" inputmode="decimal" step="any" placeholder="e.g. 140" aria-describedby="target-status"></label>
            <label class="comp-load"><input id="comp-load" type="checkbox"> Comp load</label>
          </div>
          <p id="target-status" role="status"></p>
        </div>
        <div class="controls-heading"><div><h2 id="plates-title">Add plates</h2></div><p>One tap adds a pair</p></div>
        <div id="plate-buttons" class="plate-buttons"></div>
        <div class="actions"><button id="undo" type="button" disabled>Undo</button><button id="clear" type="button" disabled>Clear all</button></div>
      </section>
    </div>
    <aside class="calculators" aria-label="Lifting calculators">
      <section class="calculator" aria-labelledby="one-rm-title">
        <h2 id="one-rm-title">1RM calculator</h2>
        <form id="one-rm-form" class="calculator-inputs">
          <label>Weight (kg)<input name="weight" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label>Reps<input name="reps" type="number" min="1" max="10" step="1" inputmode="numeric" required></label>
          <label class="calculator-wide">Formula
            <select name="formula">
              <option value="epley">Epley</option>
              <option value="brzycki">Brzycki</option>
            </select>
          </label>
        </form>
        <p class="calculator-note">Enter the weight and reps from a hard set of 1?10 reps.</p>
        <output id="one-rm-result" class="calculator-result" aria-live="polite"></output>
      </section>
      <section class="calculator" aria-labelledby="scores-title">
        <h2 id="scores-title">DOTS &amp; IPF GL Points</h2>
        <form id="score-form" class="calculator-inputs">
          <label>Bodyweight (kg)<input name="bodyweight" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label><span id="lift-result-label">Total (kg)</span><input name="liftResult" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label>Division
            <select name="division">
              <option value="men">Men</option>
              <option value="women">Women</option>
            </select>
          </label>
          <label>Equipment
            <select name="equipment">
              <option value="classic">Classic (raw)</option>
              <option value="equipped">Equipped</option>
            </select>
          </label>
          <label class="calculator-wide">Event
            <select name="eventType">
              <option value="full">Full powerlifting</option>
              <option value="bench">Bench press only</option>
            </select>
          </label>
        </form>
        <output id="score-result" class="calculator-result" aria-live="polite"></output>
      </section>
    </aside>
    </div>
    <footer>
      <span>LOADED ON BOTH SIDES</span>
      <div class="footer-credit">
        <span>Built by Nikolas Kampans</span>
        <nav class="contact-badges" aria-label="Contact Nikolas Kampans">
          <a class="contact-instagram" href="https://www.instagram.com/nicocampan">Instagram</a>
          <a class="contact-linkedin" href="https://www.linkedin.com/feed/">LinkedIn</a>
          <a class="contact-email" href="mailto:nikolas.kampans@gmail.com">Email</a>
        </nav>
      </div>
    </footer>
  </main>
  <script src="config/plates.js"></script>
  <script src="src/counter.js"></script>
  <script src="src/calculators/one-rm.js"></script>
  <script src="src/score-formulas.js"></script>
  <script src="src/calculators/scores.js"></script>
</body>
</html>
